name: Healthcare data refresh

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: healthcare-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Refresh healthcare data from official sources
        run: npm run refresh:healthcare-data

      - name: Build
        run: npm run build

      - name: Commit and push refreshed data
        run: |
          git config user.name "careatlas-data-refresh[bot]"
          git config user.email "careatlas-data-refresh@users.noreply.github.com"
          git add public/data scripts docs
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "chore: automated healthcare data refresh ($(date -u +%F))"
          git push origin main
